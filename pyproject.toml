[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcdr"
version = "1.0.0"
description = "Reproducible ROC-AUC pipeline for the Home Credit Default Risk in-class competition (GCI Global 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.5"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
dev = ["pytest>=7", "pytest-cov>=5", "httpx>=0.27", "ruff", "jupyter", "nbconvert", "ipykernel", "matplotlib", "seaborn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -ra --strict-markers"
markers = [
    "integration: multi-component workflow on tiny synthetic data (still fast, no competition data)",
    "api: FastAPI endpoint tests using TestClient",
]

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.coverage.run]
source = ["hcdr"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]
