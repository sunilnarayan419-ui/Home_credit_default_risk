name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint (ruff)
        run: ruff check src scripts tests
      - name: Unit tests (synthetic data only - no competition data in CI)
        run: pytest

  fallback:
    # proves the pipeline still works if LightGBM/XGBoost/CatBoost are unavailable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install numpy "pandas>=2.0" "scikit-learn>=1.4" pytest
          pytest tests/test_features.py tests/test_submission.py tests/test_models.py
